<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<title>Kotoba Minna no Nihongo II</title>
<style>
:root{--bg:#f3eee4;--bg2:#ebe4d6;--card:#fffefa;--ink:#2b3345;--mute:#7c8090;--line:#e4dccb;--acc:#3f5f8a;--acc2:#5b7fae;--accS:#e3ebf5;--sak:#f2c4cc;--sakS:#fbeaed;--ok:#4f8a6b;--okS:#e0f0e6;--bad:#c9605a;--badS:#fae3e0;--btnT:#fff;--sh:0 6px 20px rgba(63,95,138,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a24;--bg2:#1c2130;--card:#212736;--ink:#e7e5df;--mute:#9297a8;--line:#2f3648;--acc:#8fb1e0;--acc2:#a9c4ea;--accS:#28344d;--sak:#e7a9b5;--sakS:#3a2b35;--ok:#86c7a4;--okS:#243a30;--bad:#ee948d;--badS:#412b2b;--btnT:#141a28;--sh:0 6px 20px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#161a24;--bg2:#1c2130;--card:#212736;--ink:#e7e5df;--mute:#9297a8;--line:#2f3648;--acc:#8fb1e0;--acc2:#a9c4ea;--accS:#28344d;--sak:#e7a9b5;--sakS:#3a2b35;--ok:#86c7a4;--okS:#243a30;--bad:#ee948d;--badS:#412b2b;--btnT:#141a28;--sh:0 6px 20px rgba(0,0,0,.3)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font:16px/1.6 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;background:radial-gradient(circle at 12% -5%,var(--sakS),transparent 45%),radial-gradient(circle at 100% 10%,var(--accS),transparent 40%),var(--bg);background-attachment:fixed;min-height:100vh}
main{max-width:580px;margin:0 auto;padding:14px 16px 48px}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:26px 24px 24px;margin:6px 0 18px;color:#fff;background:linear-gradient(135deg,#34507a,#5b7fae 70%,#7d9fc9);box-shadow:var(--sh)}
.hero:after{content:"言葉";position:absolute;right:-6px;bottom:-30px;font-size:8rem;font-weight:700;opacity:.13;line-height:1}
.hero small{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:2px 12px;font-size:.78rem;letter-spacing:.05em}
.hero h1{font-size:1.65rem;margin:10px 0 4px;line-height:1.25;font-weight:700}
.hero p{margin:0;opacity:.9;font-size:.92rem;max-width:80%}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:var(--sh)}
h2{font-size:.85rem;letter-spacing:.04em;color:var(--acc);margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sak)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:8px 16px;font:inherit;font-weight:500;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--acc2)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--btnT)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:12px 14px;font:inherit;font-weight:700;cursor:pointer;transition:.15s;line-height:1.35}
.mode small{display:block;color:var(--mute);font-size:.76rem;font-weight:400;margin-top:3px}
.mode:hover{border-color:var(--acc2)}
.mode.on{background:var(--accS);border-color:var(--acc)}
.btn{width:100%;border:0;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--btnT);font:inherit;font-weight:700;font-size:1.02rem;padding:15px;cursor:pointer;margin-top:8px;box-shadow:var(--sh);transition:transform .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.4;cursor:default}
.bar{height:10px;background:var(--bg2);border-radius:9px;overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sak),var(--acc2));border-radius:9px;transition:width .35s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.82rem;margin-bottom:14px}
.q{text-align:center;padding:22px 12px;margin:-4px -4px 16px;border-radius:18px;background:var(--accS);animation:in .35s ease}
.q .lab{color:var(--acc);font-size:.82rem;font-weight:700;margin-bottom:6px}
.q .big{font-size:2.6rem;line-height:1.9;font-weight:500}
.q .mean{font-size:1.55rem;font-weight:700}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
ruby rt{font-size:.48em;color:var(--mute);font-weight:400}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:10px 14px;font:inherit;font-size:1.1rem;cursor:pointer;min-height:58px;display:flex;align-items:center;gap:14px;transition:.15s}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bg2);color:var(--mute);font-weight:700;font-size:.85rem;display:grid;place-items:center}
.opt:hover:not(:disabled){border-color:var(--acc2);transform:translateX(2px)}
.opt.ok{background:var(--okS);border-color:var(--ok)}.opt.ok b{background:var(--ok);color:#fff}
.opt.no{background:var(--badS);border-color:var(--bad)}.opt.no b{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:.95rem;animation:in .3s ease}
.fb.ok{background:var(--okS)}.fb.no{background:var(--badS)}
.score{text-align:center;padding:10px 0}
.score .n{font-size:4.2rem;font-weight:700;line-height:1.1;background:linear-gradient(135deg,var(--acc),var(--bad));-webkit-background-clip:text;background-clip:text;color:transparent}
.donut{position:relative;width:200px;height:200px;margin:0 auto 6px}.donut svg{width:100%;height:100%;display:block}.donut .n{position:absolute;inset:0;display:grid;place-items:center;font-size:2.6rem}
.score p{color:var(--mute);margin:6px 0 0}
.wl{list-style:none;margin:0;padding:0}
.wl li{padding:10px 0;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:12px}
.wl li span:last-child{color:var(--mute);text-align:right}
.top{display:flex;justify-content:flex-end}
.tg{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 14px;color:var(--mute);cursor:pointer;font:inherit;font-size:.8rem}
.back{margin-bottom:12px}
.rr{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--mute);font-size:.9rem}
.rr input{width:76px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 10px;font:inherit;text-align:center}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sg div{background:var(--accS);border-radius:16px;padding:14px 8px;text-align:center}
.sg b{display:block;font-size:1.7rem;line-height:1.2}.sg span{color:var(--mute);font-size:.78rem}
.sb{margin:10px 0}.sb .t{display:flex;justify-content:space-between;font-size:.9rem}.sb .bar{height:8px;margin:4px 0 0}
.hide{display:none}
@media(max-width:440px){.modes{grid-template-columns:1fr}.hero p{max-width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<div class="top"><button class="tg" id="tg">◐ Tema</button></div>

<section id="setup">
 <div class="hero"><small>みんなの日本語 II</small><h1>Latihan Kotoba</h1><p>Pilihan ganda kosakata per bab. Kata yang salah akan muncul lagi sampai kamu hafal.</p></div>
 <div class="card"><h2>Pilih bab</h2><div class="chips" id="chips"></div></div>
 <div class="card"><h2>Rentang nomor kata</h2><div class="chips" id="rchips"></div>
  <div class="rr">Dari <input type="number" id="rf" min="1" inputmode="numeric"> sampai <input type="number" id="rt" min="1" inputmode="numeric"></div><p class="sub" id="rinfo" style="margin:8px 0 0;font-size:.82rem"></p></div>
 <div class="card"><h2>Mode latihan</h2><div class="modes" id="modes"></div></div>
 <button class="btn" id="start">Mulai</button>
 <button class="btn ghost" id="gostat">📊 Statistik</button>
</section>

<section id="quiz" class="hide">
 <button class="tg back" id="back">← Kembali ke menu</button>
 <div class="bar"><i id="pb" style="width:0"></i></div>
 <div class="meta"><span id="pt"></span><span id="pk"></span></div>
 <div class="card">
  <div class="q" id="q"></div>
  <div class="opts" id="opts"></div>
  <div id="fb"></div>
  <button class="btn hide" id="next">Lanjut</button>
 </div>
</section>

<section id="result" class="hide"></section>
<section id="stats" class="hide"><button class="tg back" id="stback">← Kembali ke menu</button><div class="hero" style="padding:20px 22px"><h1 style="margin:0">Statistik</h1><p>Perkembangan belajarmu, tersimpan di browser ini.</p></div><div id="stbody"></div></section>
</main>

const disp=(w,r=true)=>w.j?(r?`<ruby>${w.j}<rt>${w.k}</rt></ruby>`:w.j):w.k;
let sel=new Set([26]),mode='i2j',S;

let rng={f:1,t:1e9};
const pool=()=>D.filter(w=>sel.has(w.b));
const K='mnn2stats',wk=w=>w.b+'|'+w.k;
const ld=()=>{try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return{}}};
const sv=o=>{try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}};
function rec(w,ok){const o=ld();o.a=(o.a||0)+1;o.g=(o.g||0)+(ok?1:0);
 o.b=o.b||{};const b=o.b[w.b]=o.b[w.b]||[0,0];b[0]+=ok?1:0;b[1]++;
 o.w=o.w||{};const x=o.w[wk(w)]=o.w[wk(w)]||[0,0];x[0]+=ok?0:1;x[1]++;sv(o)}
function drawSetup(){
 const bs=[...new Set(D.map(x=>x.b))],n=pool().length;
 const nn=Math.max(n,1);rng.f=Math.max(1,Math.min(rng.f,nn));rng.t=Math.max(rng.f,Math.min(rng.t,nn));
 $('#chips').innerHTML=`<button class="chip" data-a="all">Semua bab</button><button class="chip" data-a="none">Kosongkan</button>`+bs.map(b=>`<button class="chip ${sel.has(b)?'on':''}" data-b="${b}">Bab ${b}</button>`).join('');
 let h=`<button class="chip ${rng.f==1&&rng.t==n?'on':''}" data-r="1-${n}">Semua</button>`;
 for(let i=0;i<n;i+=10){const a=i+1,c=Math.min(i+10,n);h+=`<button class="chip ${rng.f==a&&rng.t==c?'on':''}" data-r="${a}-${c}">${a}–${c}</button>`}
 $('#rchips').innerHTML=h;$('#rf').value=rng.f;$('#rt').value=rng.t;
 $('#rinfo').textContent=n?`${rng.t-rng.f+1} kata dipilih dari ${n} kata (nomor berurutan sesuai bab yang dipilih)`:'Pilih minimal satu bab.';
 $('#modes').innerHTML=MODES.map(m=>`<button class="mode ${mode==m[0]?'on':''}" data-m="${m[0]}">${m[1]}<small>${m[2]}</small></button>`).join('');
 $('#start').disabled=!n;
}
const reset=()=>{rng={f:1,t:1e9}};
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.a=='all')D.forEach(x=>sel.add(x.b));else if(b.dataset.a=='none')sel.clear();
 else{const n=+b.dataset.b;sel.has(n)?sel.delete(n):sel.add(n)}
 reset();drawSetup()};

$('#rt').onchange=()=>{rng.t=+$('#rt').value||1e9;drawSetup()};
$('#modes').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;mode=b.dataset.m;drawSetup()};
$('#start').onclick=()=>{
 let words=pool().slice(rng.f-1,rng.t);
 if(mode=='kr')words=words.filter(w=>w.j);
 if(words.length<4){alert('Kata terlalu sedikit untuk mode ini. Perlebar rentang atau pilih lebih banyak bab.');return}
 begin(words);
};
const pc=(a,b)=>b?Math.floor(a/b*100):0;
function drawStats(){
 const o=ld(),a=o.a||0,ss=o.s||[],bs=Object.keys(o.b||{}).sort((x,y)=>x-y);
 const avg=ss.length?Math.floor(ss.reduce((t,x)=>t+x.sc,0)/ss.length):0;
 const hard=Object.entries(o.w||{}).filter(e=>e[1][0]>0).sort((x,y)=>y[1][0]/y[1][1]-x[1][0]/x[1][1]||y[1][0]-x[1][0]).slice(0,10);
 const ML=Object.fromEntries(MODES.map(m=>[m[0],m[1]]));
 $('#stbody').innerHTML=a?`<div class="card"><h2>Ringkasan</h2><div class="sg">
 <div><b>${a}</b><span>kata dijawab</span></div><div><b>${pc(o.g,a)}%</b><span>benar di percobaan pertama</span></div>
 <div><b>${ss.length}</b><span>sesi latihan</span></div><div><b>${avg}</b><span>rata-rata nilai sesi</span></div></div></div>
 <div class="card"><h2>Akurasi per bab</h2>${bs.map(b=>{const[g,t]=o.b[b];return`<div class="sb"><div class="t"><span>Bab ${b}</span><span>${pc(g,t)}% · ${g}/${t}</span></div><div class="bar"><i style="width:${pc(g,t)}%"></i></div></div>`}).join('')}</div>
 <div class="card"><h2>Kata tersulit</h2>${hard.length?`<ul class="wl">${hard.map(([k,v])=>{const w=D.find(x=>wk(x)==k);return w?`<li><span style="font-size:1.1rem">${disp(w)}<small style="color:var(--mute)"> · Bab ${w.b}</small></span><span>salah ${v[0]}× dari ${v[1]}</span></li>`:''}).join('')}</ul>`:'<p class="sub">Belum ada kata yang salah. Bagus.</p>'}</div>
 <div class="card"><h2>Riwayat sesi terakhir</h2><ul class="wl">${[...ss].reverse().slice(0,10).map(x=>`<li><span>${new Date(x.t).toLocaleDateString('id-ID',{day:'numeric',month:'short'})} · ${ML[x.m]||''}</span><span><b>${x.sc}</b> (${x.g}/${x.n})</span></li>`).join('')}</ul></div>
 <button class="btn ghost" id="rst">Hapus semua statistik</button>`:'<div class="card"><p class="sub" style="margin:0">Belum ada data. Selesaikan satu sesi latihan dulu, lalu statistik akan muncul di sini.</p></div>';
 const r=$('#rst');if(r)r.onclick=()=>{if(confirm('Hapus semua statistik? Tidak bisa dikembalikan.')){sv({});drawStats()}};
}
$('#gostat').onclick=()=>{$('#setup').classList.add('hide');$('#stats').classList.remove('hide');drawStats()};
$('#stback').onclick=()=>{$('#stats').classList.add('hide');$('#setup').classList.remove('hide')};

function typeFor(w){
 if(mode=='mix'){const t=['i2j','j2i'];if(w.j)t.push('kr');return t[Math.random()*t.length|0]}
 return mode;
}
function begin(words){
 S={mode,words,total:words.length,queue:sh(words).map(w=>({w,t:typeFor(w)})),first:{},done:0,tries:0,miss:new Set(),pool:D.filter(w=>sel.has(w.b))};
 if(S.pool.length<8)S.pool=D;
 ['#setup','#result'].forEach(s=>$(s).classList.add('hide'));$('#quiz').classList.remove('hide');
 ask();
}
function ask(){
 if(!S.queue.length)return finish();
 const it=S.cur=S.queue.shift(),w=it.w,t=it.t;S.locked=false;
 let key,label,promptH,correct,others;
 if(t=='i2j'){label='Apa bahasa Jepangnya?';promptH=`<div class="mean">${w.m}</div>`;key=x=>x.k+x.j;correct=disp(w);others=x=>disp(x)}
 else if(t=='j2i'){label='Apa artinya?';promptH=`<div class="big">${disp(w)}</div>`;key=x=>x.m;correct=w.m;others=x=>x.m}
 else{label='Bagaimana cara membaca kanji ini?';promptH=`<div class="big" style="line-height:1.4">${w.j}</div>`;key=x=>x.k;correct=w.k;others=x=>x.k}
 const cand=sh(S.pool.filter(x=>x.id!=w.id&&key(x)!=key(w)&&(t!='kr'||x.j)&&others(x)!=correct));
 const seen=new Set([correct]),ds=[];
 for(const x of cand){const o=others(x);if(!seen.has(o)){seen.add(o);ds.push(o)}if(ds.length==3)break}
 S.opts=sh([{h:correct,ok:1},...ds.map(h=>({h}))]);
 $('#q').innerHTML=`<div class="lab">${label}</div>${promptH}`;
 $('#opts').innerHTML=S.opts.map((o,i)=>`<button class="opt" data-i="${i}"><b>${i+1}</b><span>${o.h}</span></button>`).join('');
 $('#fb').innerHTML='';$('#next').classList.add('hide');
 $('#pb').style.width=S.done/S.total*100+'%';
 $('#pt').textContent=`Selesai ${S.done} / ${S.total}`;
 $('#pk').textContent=S.queue.length+1+' soal tersisa';
}
function pick(i){
 if(S.locked)return;S.locked=true;
 const it=S.cur,w=it.w,ok=!!S.opts[i].ok;
 document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(S.opts[j].ok)b.classList.add('ok');else if(j==i)b.classList.add('no')});
 S.tries++;
 if(!(w.id in S.first)){S.first[w.id]=ok;rec(w,ok)}
 const full=`${disp(w)} = ${w.m}`;
 if(ok){S.done++;$('#fb').innerHTML=`<div class="fb ok">Benar. ${full}</div>`}
 else{S.miss.add(w.id);const at=Math.min(S.queue.length,3+(Math.random()*3|0));S.queue.splice(at,0,{w,t:typeFor(w)});
  $('#fb').innerHTML=`<div class="fb no">Belum tepat. ${full}<br><small>Kata ini akan muncul lagi.</small></div>`}
 $('#pb').style.width=S.done/S.total*100+'%';
 const n=$('#next');n.classList.remove('hide');n.focus();
}
$('#opts').onclick=e=>{const b=e.target.closest('.opt');if(b)pick(+b.dataset.i)};
$('#next').onclick=ask;
$('#back').onclick=()=>{if(S&&S.done>0&&!confirm('Keluar dari latihan? Progres sesi ini akan hilang.'))return;$('#quiz').classList.add('hide');$('#setup').classList.remove('hide');drawSetup()};
document.addEventListener('keydown',e=>{if($('#quiz').classList.contains('hide'))return;
 if(!S.locked&&/^[1-4]$/.test(e.key)&&S.opts[e.key-1])pick(e.key-1);
 else if(S.locked&&e.key=='Enter'){e.preventDefault();ask()}});

function finish(){
 $('#quiz').classList.add('hide');const r=$('#result');r.classList.remove('hide');
 const good=Object.values(S.first).filter(Boolean).length,score=Math.floor(good/S.total*100);
 {const o=ld();o.s=(o.s||[]).concat({t:Date.now(),sc:score,n:S.total,g:good,m:S.mode}).slice(-30);sv(o)}
 const weak=S.words.filter(w=>S.miss.has(w.id));
 const msg=score>=90?'Sangat baik, tinggal dijaga.':score>=75?'Bagus, masih ada beberapa yang perlu diulang.':score>=55?'Cukup. Banyak kata yang belum menempel.':score>=35?'Masih kurang. Ulangi kata yang salah dulu.':'Belum menguasai. Tidak apa-apa, ulangi pelan-pelan.';
 r.innerHTML=`<div class="card"><div class="score"><div class="donut"><svg viewBox="0 0 120 120" role="img" aria-label="${score}% benar"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--bg2)" stroke-width="14"/><circle cx="60" cy="60" r="50" fill="none" stroke="var(--ok)" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="${score} 100" transform="rotate(-90 60 60)"/></svg><div class="n">${score}%</div></div>
 <p>${good} dari ${S.total} kata benar di percobaan pertama</p><p>${msg}</p>
 <p style="font-size:.85rem">Total jawaban: ${S.tries}. Nilai hanya menghitung jawaban pertama, jadi pengulangan tidak menaikkan nilai.</p></div></div>
 ${weak.length?`<div class="card"><h2>Kata yang belum dimengerti (${weak.length})</h2><ul class="wl">${weak.map(w=>`<li><span style="font-size:1.15rem">${disp(w)}</span><span>${w.m}</span></li>`).join('')}</ul></div>
 <button class="btn" id="redo">Ulangi kata yang belum dimengerti</button>`:'<div class="card">Tidak ada kata yang salah. Semua benar di percobaan pertama.</div>'}
 <button class="btn ghost" id="again">Kembali ke menu</button>`;
 const rd=$('#redo');if(rd)rd.onclick=()=>begin(weak);
 $('#again').onclick=()=>{r.classList.add('hide');$('#setup').classList.remove('hide');drawSetup()};
}
$('#tg').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';};
drawSetup();
</script>
</body>
</html>
